<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>手機版敬拜選曲</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    ::-webkit-scrollbar { display: none; }
    body { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 嚴謹的 CSV 解析器
    const parseCSV = (str) => {
      const rows = [];
      let row = [];
      let curr = '';
      let inQuotes = false;
      for (let i = 0; i < str.length; i++) {
        const char = str[i];
        if (char === '"') {
          if (inQuotes && str[i + 1] === '"') {
            curr += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(curr);
          curr = '';
        } else if ((char === '\n' || char === '\r') && !inQuotes) {
          if (char === '\r' && str[i + 1] === '\n') i++; 
          row.push(curr);
          rows.push(row);
          row = [];
          curr = '';
        } else {
          curr += char;
        }
      }
      if (curr !== '' || row.length > 0) {
        row.push(curr);
        rows.push(row);
      }
      return rows;
    };

    function WorshipApp() {
      const [songs, setSongs] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedKey, setSelectedKey] = useState("");
      const [selectedTempo, setSelectedTempo] = useState("");

      useEffect(() => {
        const fetchData = async () => {
          setLoading(true);
          setError(null);
          
          // 使用您「發布到網路」後的專屬 CSV 公開連結，直連「所有歌曲資料」分頁
          const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRi51ec3cxag_2cioNtmSphJKlMoA4Rt0fJrJH33cdvoXQd3Ki2uT7gbV6BdWH6dSjHBS-9PCtU6bUW/pub?gid=166702070&single=true&output=csv';
          
          try {
            const response = await fetch(csvUrl);
            if (!response.ok) {
              throw new Error(`HTTP 錯誤碼: ${response.status}`);
            }
            const csvText = await response.text();
            
            if (csvText.trim().startsWith('<!DOCTYPE html>') || csvText.includes('<html')) {
              throw new Error('回傳格式為網頁而非資料，請確認試算表已正確發布。');
            }

            const parsedData = parseCSV(csvText);
            if (parsedData.length > 1) {
              let headerRowIndex = parsedData.findIndex(row => row.some(cell => cell.trim() === '歌名'));
              if (headerRowIndex === -1) headerRowIndex = 0;

              const headers = parsedData[headerRowIndex].map(h => h.trim());
              const data = parsedData.slice(headerRowIndex + 1).map(row => {
                const obj = {};
                headers.forEach((header, index) => {
                  obj[header] = row[index] ? row[index].trim() : "";
                });
                return obj;
              }).filter(song => song['歌名'] && song['歌名'] !== "");
              
              if (data.length === 0) {
                throw new Error('成功連線但解析出 0 首歌曲，請檢查「歌名」欄位是否正確。');
              }
              setSongs(data);
            } else {
              throw new Error('試算表內容為空。');
            }
          } catch (err) {
            console.error("Fetch error:", err);
            if (window.location.protocol === 'file:') {
              setError('⚠️ 偵測到您正從本機資料夾直接開啟網頁 (file://)。請透過 GitHub Pages 網址開啟！');
            } else {
              setError(`讀取失敗：${err.message}`);
            }
          } finally {
            setLoading(false);
          }
        };

        fetchData();
      }, []);

      const uniqueKeys = useMemo(() => {
        const keys = new Set(songs.map(song => song['調性']).filter(k => k));
        return Array.from(keys).sort();
      }, [songs]);

      const uniqueTempos = useMemo(() => {
        const tempos = new Set(songs.map(song => song['速度']).filter(t => t));
        return Array.from(tempos).sort();
      }, [songs]);

      const filteredSongs = useMemo(() => {
        return songs.filter(song => {
          const matchName = !searchQuery || (song['歌名'] && song['歌名'].toLowerCase().includes(searchQuery.toLowerCase()));
          const matchKey = !selectedKey || song['調性'] === selectedKey;
          const matchTempo = !selectedTempo || song['速度'] === selectedTempo;
          return matchName && matchKey && matchTempo;
        });
      }, [songs, searchQuery, selectedKey, selectedTempo]);

      return (
        <div className="max-w-md mx-auto bg-white min-h-screen shadow-xl overflow-hidden flex flex-col font-sans relative">
          
          {/* 頂部 Header */}
          <div className="bg-slate-900 text-white p-5 pb-6 shadow-md z-10">
            <h1 className="text-2xl font-bold mb-1 flex items-center gap-2">
              🎵 手機版敬拜選曲
            </h1>
            <p className="text-slate-300 text-xs mb-4">直式單手操作 • 動態篩選 • 一鍵開啟歌譜與PPT</p>
            
            {/* 統計列 */}
            <div className="flex gap-4 text-xs font-medium mb-4 bg-slate-800 p-2 rounded-lg justify-center">
              <div className="flex items-center gap-1">
                📚 全曲庫: <span className="text-blue-300 font-bold">{songs.length}</span> 首
              </div>
              <div className="w-px bg-slate-600"></div>
              <div className="flex items-center gap-1">
                🎯 篩選結果: <span className="text-green-300 font-bold">{filteredSongs.length}</span> 首
              </div>
            </div>
            
            {/* 搜尋列 */}
            <div className="relative mb-3">
              <div className="absolute inset-y-0 left-3 flex items-center pointer-events-none text-gray-400">
                🔍
              </div>
              <input 
                type="text" 
                placeholder="搜尋歌名..." 
                className="w-full pl-10 pr-4 py-3 bg-white text-gray-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm text-base"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
              />
            </div>
            
            {/* 過濾選單 */}
            <div className="flex gap-3">
              <select 
                className="flex-1 bg-slate-800 text-white border border-slate-700 rounded-xl px-3 py-2.5 appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                value={selectedKey}
                onChange={(e) => setSelectedKey(e.target.value)}
              >
                <option value="">所有調性 ▾</option>
                {uniqueKeys.map(k => <option key={k} value={k}>{k}</option>)}
              </select>
              
              <select 
                className="flex-1 bg-slate-800 text-white border border-slate-700 rounded-xl px-3 py-2.5 appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                value={selectedTempo}
                onChange={(e) => setSelectedTempo(e.target.value)}
              >
                <option value="">所有速度 ▾</option>
                {uniqueTempos.map(t => <option key={t} value={t}>{t}</option>)}
              </select>
            </div>
          </div>

          {/* 歌曲列表區塊 */}
          <div className="flex-1 overflow-y-auto bg-gray-50 p-4 pb-20">
            {loading && (
              <div className="flex flex-col items-center justify-center h-40 text-gray-400 gap-3">
                <span className="text-2xl animate-spin">⏳</span>
                <p>載入詩歌資料庫中...</p>
              </div>
            )}
            
            {error && (
              <div className="bg-red-50 text-red-600 p-4 rounded-xl text-sm leading-relaxed shadow-sm border border-red-200">
                <p className="font-bold mb-1">連線發生問題</p>
                <p>{error}</p>
              </div>
            )}

            {!loading && !error && filteredSongs.length === 0 ? (
              <div className="flex flex-col items-center justify-center h-40 text-gray-400 gap-2">
                <span className="text-3xl">🗂️</span>
                <p>找不到符合條件的詩歌</p>
              </div>
            ) : (
              <div className="space-y-3">
                {filteredSongs.map((song, index) => (
                  <div key={index} className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex flex-col gap-3 transition-active active:scale-[0.98]">
                    
                    {/* 歌曲資訊區 */}
                    <div>
                      <div className="flex justify-between items-start mb-1">
                        <h3 className="text-lg font-bold text-gray-900 leading-tight">
                          {song['歌名']}
                        </h3>
                        <span className="text-[10px] text-gray-400 bg-gray-100 px-2 py-1 rounded-full whitespace-nowrap">
                          {song['編號']}
                        </span>
                      </div>
                      
                      <div className="flex flex-wrap gap-2 text-xs mt-2">
                        {song['調性'] && (
                          <span className="bg-blue-50 text-blue-700 px-2.5 py-1 rounded-md font-medium">
                            調性: {song['調性']}
                          </span>
                        )}
                        {song['速度'] && (
                          <span className="bg-orange-50 text-orange-700 px-2.5 py-1 rounded-md font-medium">
                            {song['速度']}
                          </span>
                        )}
                        {song['發行者'] && (
                          <span className="bg-purple-50 text-purple-700 px-2.5 py-1 rounded-md font-medium">
                            {song['發行者']}
                          </span>
                        )}
                      </div>
                      
                      {song['敬拜類型'] && song['敬拜類型'] !== '-' && (
                        <div className="text-xs text-gray-500 mt-2 flex items-center gap-1">
                          💿 {song['敬拜類型']}
                        </div>
                      )}
                    </div>

                    {/* 操作按鈕區 */}
                    <div className="flex gap-2 pt-2 mt-1 border-t border-gray-50">
                      {song['歌譜連結'] ? (
                        <a 
                          href={song['歌譜連結']}
                          target="_blank"
                          rel="noreferrer"
                          className="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl text-sm font-medium flex items-center justify-center gap-1.5 transition-colors"
                        >
                          📄 開啟歌譜
                        </a>
                      ) : (
                        <button disabled className="flex-1 bg-gray-100 text-gray-400 py-2.5 rounded-xl text-sm font-medium flex items-center justify-center gap-1.5 cursor-not-allowed">
                          📄 無歌譜
                        </button>
                      )}
                      
                      {song['PPT連結'] ? (
                        <a 
                          href={song['PPT連結']}
                          target="_blank"
                          rel="noreferrer"
                          className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl text-sm font-medium flex items-center justify-center gap-1.5 transition-colors"
                        >
                          🖥️ 開啟 PPT
                        </a>
                      ) : (
                        <button disabled className="flex-1 bg-gray-100 text-gray-400 py-2.5 rounded-xl text-sm font-medium flex items-center justify-center gap-1.5 cursor-not-allowed">
                          🖥️ 無 PPT
                        </button>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<WorshipApp />);
  </script>
</body>
</html>
